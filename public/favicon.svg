<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      .wina-disc {
        fill: #FFFFFF;
      }
      .wina-stroke {
        fill: none;
        stroke: #1A1615;
        stroke-width: 15;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      @media (prefers-color-scheme: dark) {
        .wina-disc {
          fill: #1A1615;
        }
        .wina-stroke {
          stroke: #FAF8F5;
        }
      }
    </style>
  </defs>

  <!-- Clean rounded background disc for high visibility in dark/light browser chrome -->
  <circle cx="256" cy="256" r="248" class="wina-disc" />

